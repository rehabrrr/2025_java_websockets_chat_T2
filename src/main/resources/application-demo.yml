spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./t2webchat;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      platform: h2
      mode:
      continue-on-error: false
  liquibase:
    enabled: true
    change-log: classpath:/db-migrations/h2/init.yml
    database-change-log-lock-table: lb_databasechangeloglock
    database-change-log-table: lb_databasechangelog
